name: Java Dependency Tree

on:
  push:
    branches: [PROD_CLEAN]
  pull_request:
    branches: [PROD_CLEAN]

jobs:
  dependency-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # Change to match your project's Java version

      - name: Download direct dependencies only
        run: |
         mvn dependency:go-offline \
          -DexcludeTransitive=true
